name: ArveX repair and verification

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/arvex-hosting/**'
      - 'artifacts/api-server/src/routes/orders.ts'
      - '.github/workflows/arvex-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[arvex-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply ArveX consistency fixes
        run: python3 .github/arvex_repair.py
      - name: Typecheck and build
        env:
          PORT: 5000
          BASE_PATH: /
        run: |
          pnpm --filter @workspace/arvex-hosting typecheck
          pnpm --filter @workspace/arvex-hosting build
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/arvex-hosting/src/App.tsx artifacts/api-server/src/routes/orders.ts .github/workflows/arvex-repair.yml
          git rm .github/arvex_repair.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Repair ArveX pricing and checkout flow [arvex-repair]'
          git push
